# taskmanager — full stack: postgres + redis + app
#
# Bring up:        docker compose up -d --build
# Tail app logs:   docker compose logs -f app
# Tear down:       docker compose down            (keeps data)
# Reset data:      docker compose down -v

services:
  postgres:
    image: postgres:17-alpine
    container_name: taskmanager-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskmanager
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskmanager"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: taskmanager-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskmanager-app
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/taskmanager
      REDIS_URL: redis://redis:6379
      LISTEN_ADDR: 0.0.0.0:8080
      LOG_FORMAT: json
      RUST_LOG: info,taskmanager=info,sqlx=warn,redis=warn
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  healthchecker:
    build:
      context: .
      dockerfile: Dockerfile.healthchecker
    container_name: taskmanager-healthchecker
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/taskmanager
      REDIS_URL: redis://redis:6379
      LOG_FORMAT: json
      RUST_LOG: info,taskmanager=info,sqlx=warn,redis=warn
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
